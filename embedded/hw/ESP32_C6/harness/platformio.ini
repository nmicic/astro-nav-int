[env:esp32c6]
; The registry espressif32 platform's Arduino core (2.x) has no ESP32-C6
; support; the maintained pioarduino fork ships Arduino core 3.x which does.
; Pinned to a release artifact (resolved versions in the target README).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; Serial deliberately stays on UART0 (the CH343 bridge port, 1A86:55D3):
; the C6's native USB-Serial/JTAG CDC drops output unless the host asserts
; the DTR/RTS handshake just so, and opening it can knock the chip into
; download mode. The UART bridge's auto-reset-on-open is the well-behaved
; standard ESP flow — capture on the CH343 port, not the 303A:1001 one.
build_flags = -O2 -DHW_TEST_TARGET=\"esp32-c6\" -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
