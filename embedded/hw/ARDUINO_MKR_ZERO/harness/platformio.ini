[env:mkrzero]
; Registry platform for Atmel/Microchip SAM, pinned to the version used for
; this hardware record. The SAMD21 is Cortex-M0+ @ 48 MHz with no FPU.
platform = atmelsam @ 8.3.0
board = mkrzero
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"mkrzero-samd21\"
monitor_speed = 115200
