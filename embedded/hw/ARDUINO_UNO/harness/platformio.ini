[env:uno_core]
; Classic AVR: only the core and sun profile slices fit the ATmega328P's
; 32 KB (measured 2026-07-27: core 23.1 KB / sun 24.2 KB / fix, moon, all
; overflow). This env runs the CORE slice. Platform pinned by version.
platform = atmelavr@5.3.0
board = uno
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"uno-core\"
monitor_speed = 115200
