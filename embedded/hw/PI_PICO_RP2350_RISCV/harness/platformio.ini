[env:pico2riscv]
; Same physical board as PI_PICO_RP2350, Hazard3 RISC-V execution mode.
; Same pinned platform commit as the ARM env.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2
board_build.mcu = rp2350-riscv
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"pico2-riscv\"
monitor_speed = 115200
