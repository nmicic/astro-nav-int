[env:uno_r4_wifi]
; Registry platform for the Renesas RA family, pinned to the version used
; for this hardware record. The profile runs on the RA4M1 application MCU;
; the board's ESP32-S3 connectivity coprocessor is not exercised.
platform = renesas-ra @ 1.9.0
board = uno_r4_wifi
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"freenove-ra4m1\"
monitor_speed = 115200
