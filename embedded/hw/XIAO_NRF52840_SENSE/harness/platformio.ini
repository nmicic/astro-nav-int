[env:xiao_nrf52840]
; Registry nordicnrf52 platform lacks this board; maxgerhardt fork pinned
; to the exact commit this harness was first built with. Adafruit nRF52 core
; (Seeed variant). -DUSE_TINYUSB is required: the core's USB CDC lives in
; TinyUSB and linking fails with `undefined reference to 'Serial'` without
; it (main.cpp guards the Adafruit_TinyUSB.h include behind it).
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git#cac6fcf943a41accd2aeb4f3659ae297a73f422e
board = xiaoble_adafruit
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"xiao-nrf52840\" -DUSE_TINYUSB
monitor_speed = 115200
