[env:mega2560_all]
; ATmega2560: 253,952 B usable flash — the only classic AVR that fits the
; whole library (`all` = 130.7 KB measured 2026-07-27). Same prepare.sh as
; the 32-bit targets (profile_all.c, host-pinned at prepare time).
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"mega2560-all\"
monitor_speed = 115200
