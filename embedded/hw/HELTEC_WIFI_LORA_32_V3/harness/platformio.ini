[env:heltec_v3]
; Same pinned pioarduino release as ESP32_C6 (Arduino core 3.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
; The Heltec V3's USB-C is wired through a CP2102 UART bridge (10C4:EA60) to
; UART0 — the S3's native USB is not on the connector — so Serial stays on
; UART0 explicitly, same reasoning as ESP32_C6.
build_flags = -O2 -DHW_TEST_TARGET=\"heltec-esp32-s3\" -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
