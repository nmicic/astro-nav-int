[env:pico2]
; Registry raspberrypi platform (mbed core) supports only the RP2040 Pico;
; the maxgerhardt fork with the arduino-pico core supports RP2350 in both
; ARM and RISC-V modes. Pinned to the exact commit the recorded
; results were built with.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2
framework = arduino
build_flags = -O2 -DHW_TEST_TARGET=\"pico2-arm\"
monitor_speed = 115200
